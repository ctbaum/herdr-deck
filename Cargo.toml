[package]
name = "herdr-deck"
version = "0.2.0"
edition = "2024"
description = "The companion workspace launcher for herdr-agents.nvim: open or resume Claude, Codex, and Pi in a ready-made Neovim, agent, and shell deck."
license = "MIT"
repository = "https://github.com/ctbaum/herdr-deck"

[dependencies]
ratatui = "0.30.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
